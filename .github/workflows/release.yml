name: Build and Release Atlas

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Atlas/Atlas.csproj

      - name: Build
        run: dotnet publish Atlas/Atlas.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Package
        run: |
          Compress-Archive -Path publish\* -DestinationPath Atlas-win-x64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Atlas-win-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
